<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rk0cc open source project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
        integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/standard_style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="favicon.ico">
    <style>
        body>div.welcome-banner:first-child {
            height: 50vh;
            background-color: var(--m-on-primary-container);
            color: var(--m-primary-fixed);
        }

        body>div.welcome-banner:first-child>div.welcome-banner-content {
            justify-content: center;
        }

        @media only screen and (min-width: 992px) {
            nav.navbar {
                min-height: 75px;
            }

            nav.navbar a.navbar-brand:first-child {
                display: none;
            }

            nav.navbar.is-sticked a.navbar-brand:first-child {
                display: inline-block;
            }

            body>div.welcome-banner:first-child>div.welcome-banner-content {
                justify-content: space-evenly;
                width: 50%;
            }
        }
    </style>
</head>

<body>
    <div class="d-flex flex-column align-items-center justify-content-center welcome-banner">
        <div class="d-flex flex-row align-items-center welcome-banner-content">
            <img src="assets/logo.svg" width="200" class="d-block" />
            <h1 class="welcome-banner-brand display-1 fw-bolder">rk0cc</h1>
        </div>
    </div>
    <nav class="navbar navbar-expand-lg sticky-lg-top fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" aria-disabled="true">
                <img src="assets/logo.svg" width="50" />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Resources</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="my-2 mx-lg-4">
        <h1 class="display-2 w-100 text-center">An engineer in two branches</h1>
        <div class="d-flex flex-column flex-lg-row align-items-center justify-content-around text-center">
            <div class="container m-4">
                <i class="fa-solid fa-code fa-8x"></i>
                <h1 class="display-3">Software</h1>
            </div>
            <div class="container m-4">
                <i class="fa-solid fa-microchip fa-8x"></i>
                <h1 class="display-3">Electrical</h1>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"
        integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js"
        integrity="sha512-6BTOlkauINO65nLhXhthZMtepgJSghyimIalb+crKRPhvhmsCdnIuGcVbR5/aQY2A+260iC1OPy1oCdB6pSSwQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        (function () {
            const stickedClassName = "is-sticked";
            const welcomeBanner = document.querySelector("body > div.welcome-banner");

            window.addEventListener("scroll", function (e) {
                const navbar = document.querySelector("nav.navbar");
                console.log(window.scrollY);

                if (window.scrollY > welcomeBanner.offsetHeight) {
                    navbar.classList.add(stickedClassName);
                } else {
                    navbar.classList.remove(stickedClassName);
                }
            });
        })();
    </script>
</body>

</html>
